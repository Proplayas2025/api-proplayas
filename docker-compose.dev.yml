version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: proplayas-api-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql://proplayas:proplayas@postgres:5432/proplayas_db
      - DATABASE_ECHO=True
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASSWORD=
      - FROM_EMAIL=noreply@proplayas.org
      - FROM_NAME=Proplayas
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./app:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proplayas-network

  postgres:
    image: postgres:16-alpine
    container_name: proplayas-postgres-dev
    environment:
      - POSTGRES_USER=proplayas
      - POSTGRES_PASSWORD=proplayas
      - POSTGRES_DB=proplayas_db
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proplayas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - proplayas-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: proplayas-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - proplayas-network

volumes:
  postgres_data_dev:

networks:
  proplayas-network:
    driver: bridge
